[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "asl_research"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Alex Pham" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "ipython",
    "jupyterlab",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "av==11.0.0; python_version >= '3.12'",
    "av; python_version <= '3.11'",
    "opencv-python",
    "torch",
    "tqdm",
    "torcheval",
    "pytorchvideo",
    "mediapipe; python_version >= '3.12'",
    "mediapipe==0.10.9; python_version == '3.11'"
    "rouge_score",
    "nltk"
]
requires-python = ">=3.11.0"

[project.scripts]
download = "asl_research.data.download:main"
preprocess = "asl_research.data.preprocess:main"
train = "asl_research.train:main"

[tool.ruff]
line-length = 99
src = ["asl_research"]
include = ["pyproject.toml", "asl_research/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["asl_research"]
force-sort-within-sections = true
